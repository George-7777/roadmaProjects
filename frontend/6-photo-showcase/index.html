<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo showcase</title>
</head>
<body>
    <header>
        <h1>Photo showcase</h1>
    </header>

    <main>
        <figure>
            <img src="images/dog_router.webp" alt="router of dogs" height="500" width="500">
            <figcaption>This is router of dogs</figcaption>
        </figure>

        <figure>
            <img src="images/sokrat.png" alt="Sokrat" height="500" width="500">
            <figcaption>His name is Sokrat</figcaption>
        </figure>

        <figure>
            <img src="images/the_man.jpg" alt="man" height="500" width="500">
            <figcaption>He is man</figcaption>
        </figure>

        <img src="https://img.goodfon.ru/wallpaper/big/d/1c/smailiki-zheltye-shary-ulybki.webp" alt="" height="700" width="1000">

        <figure>
            <img src="https://example.com/image.jpg" alt="Mister Placeholder" height="500" width="500">
            <figcaption>This is Mister Placeholder</figcaption>
        </figure>
        <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWT0L0iD8BtRaxb8JAHLX2wUZ2NrOVEMgj1ORmU3F7RA&s=10" alt="blue bird" height="500" width="500">
            <figcaption>This is blue bird</figcaption>
        </figure>

        <video controls poster="images/video_placeholder.jpg">
            <source src="videos/video.mp4" type="video/mp4">
            <p>
                Browser dont video =(
                <a href="videos/video.mp4">link for video =)</a>.
            </p>
        </video>
    </main>

    <footer>
        <p>© Photo showcase. All rights reserved</p>
    </footer>
</body>
</html>
